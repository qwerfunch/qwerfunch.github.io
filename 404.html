<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page not found</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #FEFBF0; color: #292524; margin: 0; }
        main { max-width: 38rem; margin: 15vh auto; padding: 2rem; }
        h1 { font-size: 2rem; }
        p { line-height: 1.6; }
        a { color: #9a4d0b; overflow-wrap: anywhere; }
    </style>
</head>
<body>
    <main>
        <section id="not-found">
            <h1>404 — Page not found</h1>
            <p>The page you requested could not be found.</p>
            <p><a href="/">Return to qwerfunch's homepage</a></p>
        </section>
        <section id="legacy-redirect" hidden>
            <h1>LogcatOn has moved</h1>
            <p>Downloads and release notes are now at:</p>
            <p><a id="legacy-redirect-link" href="https://purpleeddy.github.io/logcat-on-releases/">https://purpleeddy.github.io/logcat-on-releases/</a></p>
            <p>Your browser will take you there automatically. You can also follow the link above.</p>
        </section>
        <noscript><p>For an old LogcatOn link, visit <a href="https://purpleeddy.github.io/logcat-on-releases/">LogcatOn's new website</a>.</p></noscript>
    </main>
    <script type="module">
        import { relayTarget, forwardLegacyLocation } from '/logcat-on-releases/relay.js';
        if (relayTarget(window.location)) {
            document.title = 'LogcatOn has moved';
            document.getElementById('not-found').hidden = true;
            document.getElementById('legacy-redirect').hidden = false;
            forwardLegacyLocation(window.location, document);
        }
    </script>
</body>
</html>
